<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seeds — Jodhpur, IN</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #map { height: 100vh; }
  #panel {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: white; padding: 10px 20px 12px; border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,.18); z-index: 1000; text-align: center;
    min-width: 260px;
  }
  #panel h2 { font-size: 15px; font-weight: 600; color: #111; }
  #panel .sub { font-size: 12px; color: #666; margin-top: 3px; }
  .note { color: #888; font-size: 11px; }
  #legend {
    position: absolute; bottom: 24px; right: 12px;
    background: white; padding: 8px 12px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15); z-index: 1000;
    max-height: 60vh; overflow-y: auto; font-size: 12px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; padding: 2px 0; cursor: pointer; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
</style>
</head>
<body>
<div id="panel">
  <h2 id="title">Jodhpur, IN &mdash; 4 regions</h2>
  <div class="sub" id="sub">hover a region &middot; click to focus </div>
</div>
<div id="map"></div>
<div id="legend"></div>
<script>
var map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

var data = {"type": "FeatureCollection", "features": [{"type": "Feature", "properties": {"name": "Jodhpur South-West", "color": "#f58231", "area": 0.012808516499999466}, "geometry": {"type": "Polygon", "coordinates": [[[72.92822, 26.24732], [72.92495, 26.25623], [72.92377, 26.26986], [72.928, 26.28093], [72.93287, 26.28617], [72.93902, 26.28982], [72.95347, 26.29212], [72.95567, 26.2968], [73.0351, 26.2968], [73.0351, 26.18804], [73.03271, 26.18619], [73.02359, 26.18175], [73.01096, 26.18184], [72.97866, 26.19415], [72.97063, 26.20054], [72.95783, 26.20402], [72.94717, 26.2105], [72.94072, 26.21744], [72.93785, 26.22396], [72.93492, 26.24004], [72.92822, 26.24732]]]}}, {"type": "Feature", "properties": {"name": "Jodhpur South-East", "color": "#4363d8", "area": 0.008560499600000118}, "geometry": {"type": "Polygon", "coordinates": [[[73.10933, 26.2968], [73.11381, 26.26728], [73.11247, 26.25722], [73.10542, 26.24673], [73.06643, 26.21229], [73.0351, 26.18804], [73.0351, 26.2968], [73.10933, 26.2968]]]}}, {"type": "Feature", "properties": {"name": "Jodhpur North-West", "color": "#3cb44b", "area": 0.006502139800000088}, "geometry": {"type": "Polygon", "coordinates": [[[72.96026, 26.30656], [72.97159, 26.31606], [72.97541, 26.33385], [72.98021, 26.34256], [72.98586, 26.34747], [72.9927, 26.35049], [73.00013, 26.35135], [73.00932, 26.34923], [73.01039, 26.36219], [73.01397, 26.36877], [73.01933, 26.37399], [73.026, 26.37739], [73.03338, 26.37866], [73.0351, 26.37847], [73.0351, 26.2968], [72.95567, 26.2968], [72.96026, 26.30656]]]}}, {"type": "Feature", "properties": {"name": "Jodhpur North-East", "color": "#e6194b", "area": 0.006062364099999929}, "geometry": {"type": "Polygon", "coordinates": [[[73.0582, 26.37585], [73.06609, 26.37108], [73.08714, 26.35178], [73.09797, 26.3313], [73.09903, 26.32205], [73.0973, 26.3139], [73.10553, 26.30456], [73.10933, 26.2968], [73.0351, 26.2968], [73.0351, 26.37847], [73.0582, 26.37585]]]}}]};
var layers = {};

var legend = document.getElementById('legend');
var geoLayer = L.geoJSON(data, {
  style: function(f) {
    return {
      color: f.properties.color, weight: 2, opacity: 1,
      fillColor: f.properties.color, fillOpacity: 0.2
    };
  },
  onEachFeature: function(f, layer) {
    var name = f.properties.name;
    layers[name] = layer;
    layer.bindTooltip(name, {sticky: true});
    layer.on('mouseover', function() {
      layer.bringToFront();
      layer.setStyle({fillOpacity: 0.45, weight: 3});
      document.getElementById('sub').textContent = name;
    });
    layer.on('mouseout', function() {
      layer.setStyle({fillOpacity: 0.2, weight: 2});
      document.getElementById('sub').textContent = 'hover a region · click to focus';
    });
    layer.on('click', function() {
      map.fitBounds(layer.getBounds(), {padding: [40, 40]});
    });

    var item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML =
      '<div class="legend-swatch" style="background:' + f.properties.color + '"></div>' +
      '<span>' + name + '</span>';
    item.addEventListener('click', function() {
      map.fitBounds(layer.getBounds(), {padding: [40, 40]});
    });
    legend.appendChild(item);
  }
}).addTo(map);
map.fitBounds(geoLayer.getBounds(), {padding: [20, 20]});
</script>
</body>
</html>
